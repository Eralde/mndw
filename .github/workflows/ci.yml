name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The daemon lands in Phase 2; until it has a go.mod there is nothing to test.
      - name: Test
        run: |
          if [ -f daemon/mndwd/go.mod ]; then
            cd daemon/mndwd && go test ./...
          else
            echo "daemon/mndwd/go.mod not present yet — skipping go test"
          fi

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @mndw/ui exec playwright install --with-deps chromium

      - name: Run UI browser tests
        run: pnpm --filter @mndw/ui test:e2e

  busybox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run the daemon sh-exec suite where /bin/sh is BusyBox ash (the router
      # shell family). Uses `docker run` rather than a `container:` job so the
      # glibc-linked checkout action runs on the host, and so the CI command is
      # identical to the local reproduction command. opkg stubbed; no -race.
      - name: Run daemon sh-exec suite under BusyBox ash
        run: docker run --rm -v "$PWD":/src -w /src golang:1.26-alpine sh build/packaging/ci/run-busybox-tests.sh
