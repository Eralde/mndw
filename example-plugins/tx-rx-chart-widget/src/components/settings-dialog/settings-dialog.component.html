<div class="settings-dialog__form">
    <div class="settings-dialog__field">
        <label class="settings-dialog__label">Interface</label>
        <tx-rx-interface-select
          [interfaces]="interfaces"
          [selectedId]="selectedInterface"
          (selectedChange)="interfaceChange.emit($event)"
        />
    </div>
    <div class="settings-dialog__field">
        <label class="settings-dialog__label">Refresh interval</label>
        <div class="settings-dialog__refresh-control">
            <input
              #refreshInput
              type="range"
              min="1"
              max="5"
              step="0.5"
              [value]="refreshMsToSeconds(refresh)"
              [attr.aria-valuetext]="refreshMsToSeconds(refresh) + ' seconds'"
              (input)="onRefreshChange(refreshInput.value)"
              class="settings-dialog__range"
            />
            <output class="settings-dialog__output">{{ refreshMsToSeconds(refresh) }} s</output>
        </div>
    </div>
    <div class="settings-dialog__actions">
        <button
            class="settings-dialog__close-btn"
            (click)="closeDialogEvent.emit()"
        >
            Close
        </button>
    </div>
</div>
