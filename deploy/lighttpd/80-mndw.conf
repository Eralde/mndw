# mndw v2. Local overrides can go in any conf.d/82-*.conf.

# Load required lighttpd modules, but only once.
include_shell "sh /opt/share/www/mndw/bin/mndw-load-modules.sh"

$SERVER["socket"] == ":99" {
  server.document-root = "/opt/share/www/mndw"
  index-file.names = ("index.html")

  alias.url += ( "/user-plugins/" => "/opt/share/www/mndw/user-plugins/" )

  # Proxy API + WebSocket to mndwd. WebSocket upgrade headers required.
  $HTTP["url"] =~ "^/(api|ws)/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 9090 )) )
    proxy.header = ( "upgrade" => "enable" )
  }

  $HTTP["url"] =~ "^/(rci|ci|auth)(/.*)?$" {
    include "/opt/var/lib/mndw/proxy-target.conf"
  }

  $HTTP["url"] !~ "^/(auth|rci|ci|api|ws)(/|$)" {
    url.rewrite-if-not-file = ( "^/.*$" => "/index.html" )
  }
}
