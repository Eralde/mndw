@if (hasData()) {
    <div
      #container
      class="chart-container"
      style="width:100%;height:100%"
    >
        @if (tooltipVisible()) {
            <div
                class="chart-tooltip"
                [style.left.px]="tooltipLeft()"
                [style.top.px]="tooltipTop()"
            >
                <div>{{ tooltipTime() }}</div>
                <div class="chart-tooltip__tx">TX: {{ tooltipTx() }}</div>
                <div class="chart-tooltip__rx">RX: {{ tooltipRx() }}</div>
            </div>
        }
    </div>
} @else {
    <p class="chart-placeholder">No data available</p>
}
