name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workspace packages
        run: pnpm -r --no-bail --if-present test

      - name: Test build scripts
        run: pnpm test:build

      - name: Test pixel audit
        run: pnpm test:px-audit

      - name: Test npm packaging
        run: pnpm test:npm

      - name: Test documentation
        run: pnpm test:docs

      - name: Check host
        run: pnpm --filter @mndw/host check

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Test Go modules
        run: sh build/go-each-module.sh

      - name: Vet mndwd
        run: go vet ./...
        working-directory: daemon/mndwd

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Test mndwd with race detector
        run: go test -race -skip '^TestCrashAtEveryAcceptanceStep$' ./...
        working-directory: daemon/mndwd
