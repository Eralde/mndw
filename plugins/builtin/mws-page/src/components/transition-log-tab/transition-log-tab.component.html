<section class="transition-log-tab" aria-label="{{ t('transition-log.title') }}">
  <div class="filters">
    <mndw-field [label]="t('transition-log.client')">
      <mndw-input
        data-filter="client"
        type="search"
        [value]="clientFilter"
        (mndwinput)="onClientFilter($event)"
      ></mndw-input>
    </mndw-field>
    <mndw-field [label]="t('transition-log.source')">
      <mndw-input
        data-filter="source"
        type="search"
        [value]="sourceFilter"
        (mndwinput)="onSourceFilter($event)"
      ></mndw-input>
    </mndw-field>
    <mndw-field [label]="t('transition-log.target')">
      <mndw-input
        data-filter="target"
        type="search"
        [value]="targetFilter"
        (mndwinput)="onTargetFilter($event)"
      ></mndw-input>
    </mndw-field>
    <mndw-field [label]="t('transition-log.time')">
      <mndw-select
        data-filter="time"
        value="all"
        (mndwchange)="onTimeFilter($event)"
      >
        <mndw-option value="all">{{ t('transition-log.all') }}</mndw-option>
        <mndw-option value="current">{{ t('transition-log.current') }}</mndw-option>
      </mndw-select>
    </mndw-field>
  </div>
  <div class="event-filter-row">
    <fieldset class="event-filters">
      <legend class="mndw-field__label">{{ t('transition-log.event-types') }}</legend>
      <div class="event-options">
        @for (type of eventTypes; track type) {
          <mndw-checkbox
            [attr.data-event-type]="type"
            [checked]="selectedEventTypes.includes(type)"
            (mndwchange)="onEventTypeChange(type, $event)"
          >{{ eventLabel(type) }}</mndw-checkbox>
        }
      </div>
    </fieldset>
    <div class="actions">
      <mndw-button
        variant="secondary"
        data-action="download-csv"
        [disabled]="visibleEntries().length === 0"
        (click)="downloadCsv()"
      >
        {{ t('transition-log.download-csv') }}
      </mndw-button>
    </div>
  </div>
  @if (streamError) {
    <p class="error" role="alert">{{ streamError }}</p>
  }
  <mndw-table
    [columns]="columns"
    [rows]="visibleEntries()"
    rowKey="id"
    [caption]="t('transition-log.title')"
    [emptyLabel]="entries().size > 0 && visibleEntries().length === 0 ? t('transition-log.no-match') : t('transition-log.empty')"
  ></mndw-table>
</section>
