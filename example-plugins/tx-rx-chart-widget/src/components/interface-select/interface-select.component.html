<div class="interface-select">
    <button
        #trigger
        type="button"
        class="interface-select__trigger"
        role="combobox"
        aria-haspopup="listbox"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="listboxId"
        [attr.aria-activedescendant]="activeOptionId()"
        (click)="toggleOpen()"
        (keydown)="onTriggerKeydown($event)"
    >
        <span
            class="interface-select__value"
            [class.interface-select__value--placeholder]="!selectedId"
        >
            {{ selectedLabel() || 'Select interface…' }}
        </span>
        <span class="interface-select__arrow" aria-hidden="true">&#9662;</span>
    </button>

    <div
        class="interface-select__panel"
        role="listbox"
        [id]="listboxId"
        [hidden]="!open()"
        [style.position]="'fixed'"
        [style.z-index]="1000"
        [style.left.px]="position()?.left"
        [style.top.px]="position()?.top"
        [style.width.px]="position()?.width"
        [style.max-height.px]="position()?.maxHeight"
    >
        @for (iface of interfaces; track iface.id; let index = $index) {
            <div
                class="interface-select__option"
                [class.interface-select__option--active]="activeIndex() === index"
                [class.interface-select__option--selected]="selectedId === iface.id"
                [attr.data-interface-id]="iface.id"
                [id]="optionId(index)"
                role="option"
                [attr.aria-selected]="selectedId === iface.id"
                (click)="onSelect(iface.id)"
                (mouseenter)="activeIndex.set(index)"
            >
                <span class="interface-select__option-label">{{ iface.description || iface.id }}</span>
                @if (selectedId === iface.id) {
                    <span aria-hidden="true">&#10003;</span>
                }
            </div>
        }
    </div>
</div>
